           段间「与」接＋开国/即位，每名单首条＝开国）与在位栏（合段年大写）；
           在位年得带单位缀（月/天，缺省即年，如 |1月、|60天；年月
           并月（1年=12月）、天自为计——天不升格为月，大单位在场
           天径弃：纯年显年、满一年显年弃月弃天、满一月显月弃天、
           纯天显天）；
           非君主行不书、无此栏
       自动生成栏（无需书写）：
         · 位次（左一·黑）：在名单者「前缀＋第N位＋位次用字」（用字见
           @rank-word，缺省 皇帝，如 大清第壹位皇帝），
           按所属 @throne 名单内首现序独立编序
         · 排行（右一·黑）：按父下齿序「長子/次子/叁子…」，
           父在任一 @throne 名单且位次用字为「皇帝」者冠皇字（如 皇長子）；
           行内书独立段「序齒N」（N 阿拉伯数字，简繁均认；位置无关——
           习惯收行尾，年对之后亦合法；一行至多一个）者，排行后空一字
           接排「序齒N子」（序數同齿序用字：1 長、2 次、叁起大写；
           同墨黑）——序齒由数据手书（殤夭未序齒者省），齿序则恒自动
       显示范围：图渲染数据块全部人物；名单成员（君）诸栏加粗
         （君主至七栏）、位次带前缀编号，其余宗室照常入图（不加粗）

         不渲染；带序号键 @throneN 已废，书写即整行静默弃置），
         条目＝名字|称号（称号＝称号栏首节，年号不计入），与人物行严格
         匹配——重名者赖称号甄别（如 姬某|晉殤叔 只命中其一人）；
         裸名为旧式（仅全树名字唯一时可用），歧义或未匹配条目经控制台
         告警后跳过、不占号；占位名须带甄别称号，裸列严禁；
         值可带「前缀:」（如 大清:）用作位次前缀；
         君位传承不画线（图内常驻连线仅父子血缘墨线），名单仅驱动——
         位次按首现序数编号（复辟重入列不占号）与名单成员诸栏加粗
       @rank-word=位次用字（可省，缺省 皇帝；先秦壳可改 國君）：
         值非「皇帝」时排行栏不冠皇字
       @focus-skip=前缀,…：该前缀名单不入悬浮传位层
         （其成员悬停/点击无反应）
       @watermark=字 / @watermark-art=掩模路径：纸面固定水印（视口固定
         不随滚移），二择一、均省略即无水印——
         · @watermark=字：蒸馏团窠（单线外环＋云龙环＋轮廓心盘＋中心字）
         · @watermark-art=线稿 PNG（美术稿，如盘龙椭圆章，墨色透底）：
           由母本图经 tools/make-mask.mjs 生成（亮度→alpha 抽线稿、
           墨色烘入、滤掉母本纸底），页面以 img 元素直挂
       @seal=图径：右端题识下之方印（边长定值 100px），题识块下居中，
         坐题识文字之下、不覆字；诸朝壳共用方印 seal-common.png（主人印、
         不随朝易）已内置于壳，省略此行即无
       悬浮传位层（渐进增强，默认面无浮层）：鼠标移至名单成员浮现——
         朱线连以该节点为端点的顺接相邻边（含复辟对与重入边）：
         父死子继沿父子墨线梳路覆描；其余边侧端口直连（端口＝最外
         文字块外缘＋气口，横跨淡影无妨；邻格侧口行程过短容不下箭镞时
         改梳形顶/底入；
         跨辈继任在下单肘、在上双肘，另备侧出早升/早降侧入，
         源端亦得顶/底出名柱经廊道横穿，
         竖直段让开名柱不与他线重描；同层诸线互不相交，朱线亦不穿
         四人上下文（出线者前序、出线者、入线者、入线者后序）之字格，
         前序/后序纵在当前层淡出亦恒不可穿——每边路线布局时一次定死，
         悬停任一端点皆同形（连线存在期间不变）；致穿时改走绕行变体，
         洁净路中取转折少且末段容得下箭镞者，同折数取少穿淡影者，
         竖段让出梳线横担跨度及其两端格宽），
         复辟来回对上下均布二道（按行高四分位）；收端一枚箭镞明传向；无关人员半透明、
         墨线退为背景；移开即净；点击钉住（再点同帝解除、点他帝改钉、
         点空白解除）
